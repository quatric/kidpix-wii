name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 make ca-certificates

      - name: Build GRRLIB and controller libraries (libwiidrc, libwupc, libsicksaxis)
        run: |
          ./scripts/build_controller_portlibs.sh
          ./scripts/build_grrlib.sh

      - name: Build boot.dol
        run: make

      - name: Fetch jskidpix art and sounds (pinned commit)
        run: |
          git clone --quiet https://github.com/vikrum/kidpix /tmp/jskidpix
          git -C /tmp/jskidpix checkout --quiet 99c67f3427d229f7db60b03dcf19df4d8c2a8ecf
          tools/prep_assets.sh /tmp/jskidpix

      - name: Package
        run: |
          mkdir -p out/apps/kidpix/saves
          cp boot.dol meta.xml icon.png README.md LICENSE out/apps/kidpix/
          cp -R assets out/apps/kidpix/assets
          touch out/apps/kidpix/saves/.keep

      - uses: actions/upload-artifact@v4
        with:
          name: kidpix-wii
          path: out/

      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apt-get install -y --no-install-recommends zip
          (cd out && zip -r ../kidpix-wii.zip apps)

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: kidpix-wii.zip
