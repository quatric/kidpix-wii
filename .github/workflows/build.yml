name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 make ca-certificates

      - name: Build GRRLIB and controller libraries (libwiidrc, libwupc, libsicksaxis)
        run: |
          ./scripts/build_controller_portlibs.sh
          ./scripts/build_grrlib.sh

      - name: Build boot.dol
        run: make

      - name: Package (no game art is redistributed; see README for tools/prep_assets.sh)
        run: |
          mkdir -p out/apps/kidpix
          cp boot.dol meta.xml icon.png out/apps/kidpix/
          cp README.md out/apps/kidpix/

      - uses: actions/upload-artifact@v4
        with:
          name: kidpix-wii
          path: out/

      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apt-get install -y --no-install-recommends zip
          (cd out && zip -r ../kidpix-wii.zip apps)

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: kidpix-wii.zip
