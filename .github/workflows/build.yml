name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 make ca-certificates

      - name: Build GRRLIB and controller libraries (libwiidrc, libwupc, libsicksaxis)
        run: |
          ./scripts/build_controller_portlibs.sh
          ./scripts/build_grrlib.sh

      - name: Build boot.dol
        run: make

      - name: Fetch jskidpix art and sounds (pinned commit)
        run: |
          git clone --quiet https://github.com/vikrum/kidpix /tmp/jskidpix
          git -C /tmp/jskidpix checkout --quiet 99c67f3427d229f7db60b03dcf19df4d8c2a8ecf
          tools/prep_assets.sh /tmp/jskidpix

      - name: Package
        run: |
          mkdir -p out/apps/kidpix/saves
          cp boot-xz.dol out/apps/kidpix/boot.dol
          cp meta.xml icon.png README.md LICENSE out/apps/kidpix/
          cp -R assets out/apps/kidpix/assets
          touch out/apps/kidpix/saves/.keep

      - uses: actions/upload-artifact@v4
        with:
          name: kidpix-wii
          path: out/
      - name: Zip the release
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
          (cd out && zip -r "$GITHUB_WORKSPACE/kidpix-wii.zip" apps)
      - uses: actions/upload-artifact@v4
        with:
          name: release-kidpix-wii
          if-no-files-found: error
          path: |
            kidpix-wii.zip

  # Every push to the default branch refreshes the "latest" release; tags like v1.2.0 also get their own release.
  release:
    needs: wii
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-kidpix-wii
          path: out
      - name: Move the latest tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kid Pix for Wii (latest)
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Latest build of Kid Pix for Wii from ${{ github.sha }}.

            Extract kidpix-wii.zip to the root of your SD card (or USB drive) and open Kid Pix for Wii from the Homebrew Channel.
          files: |
            out/kidpix-wii.zip
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Kid Pix for Wii ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Extract kidpix-wii.zip to the root of your SD card (or USB drive) and open Kid Pix for Wii from the Homebrew Channel.
          files: |
            out/kidpix-wii.zip
